name: MegaSource
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_partial:
        type: boolean
        default: false
        description: Permitir explicitamente fuentes incompletas
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
  update:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build source
        env:
          ALLOW_PARTIAL: ${{ inputs.allow_partial }}
        run: |
          if [ "$ALLOW_PARTIAL" = "true" ]; then python build.py --allow-partial; else python build.py; fi
      - name: Prepare review branch and PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then exit 0; fi
          branch="update/megasource-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MegaSource.json build-report.json
          git commit -m "chore: refresh MegaSource feed"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Actualizar fuente MegaSource" --body "Feed generado; revisar build-report.json antes de fusionar."
